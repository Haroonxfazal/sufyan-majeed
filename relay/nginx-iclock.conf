# Relay for the ZKTeco fingerprint machine.
# The machine can only be pointed at an IP address, but the Worker is reached by name.
# This server has a fixed IP, accepts the machine's plain-HTTP requests on port 80 and
# forwards ONLY /iclock/* to the Worker (HTTPS, with the correct Host name).

# Also record what the machine POSTs (debugging aid; only /iclock traffic, small bodies).
log_format iclock_body '$time_iso8601 $remote_addr "$request" $status req_body="$request_body"';

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 5m;

    # nginx re-resolves the Worker's address (Cloudflare IPs can change)
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    set $worker unique-academy.haroonxfazal.workers.dev;

    location /iclock/ {
        access_log /var/log/nginx/iclock_body.log iclock_body;
        client_body_buffer_size 1m;
        proxy_pass https://$worker$request_uri;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $worker;
        proxy_set_header Host $worker;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering on;                 # read the whole (small) reply first
        proxy_set_header Accept-Encoding ""; # no compression, so Content-Length is kept
        chunked_transfer_encoding off;      # old ZKTeco firmware cannot read chunked replies
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Nothing else is exposed.
    location / {
        return 404;
    }
}
